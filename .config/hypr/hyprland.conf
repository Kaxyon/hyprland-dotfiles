# ==============================================================================
# HYPRLAND MAIN CONFIGURATION
# Minimal & Aesthetic Rice - Catppuccin Mocha Theme
# ==============================================================================

# Monitor Setup (Auto-detect resolution & refresh rate, scale 1)
monitor=,preferred,auto,1

# Source modular configuration files
source = ~/.config/hypr/hyprland.conf.d/env.conf
source = ~/.config/hypr/hyprland.conf.d/execs.conf
source = ~/.config/hypr/hyprland.conf.d/style.conf
source = ~/.config/hypr/hyprland.conf.d/windowrules.conf
source = ~/.config/hypr/hyprland.conf.d/keybinds.conf

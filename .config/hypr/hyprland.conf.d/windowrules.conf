# ==============================================================================
# WINDOW RULES & WORKSPACE ASSIGNMENTS
# ==============================================================================

# Floating Dialogs & Utilities
windowrulev2 = float, class:^(Rofi)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, title:^(Media viewer)$
windowrulev2 = float, title:^(Volume Control)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(swappy)$

# Centered Dialogs
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = center, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(org.kde.polkit-kde-authentication-agent-1)$

# Size Constraints for Floating Utilities
windowrulev2 = size 700 500, class:^(pavucontrol)$
windowrulev2 = size 700 500, class:^(blueman-manager)$
windowrulev2 = size 700 500, class:^(nm-connection-editor)$

# Picture in Picture pinning
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = move 72% 70%, title:^(Picture-in-Picture)$

# Idle Inhibitor Rules
windowrulev2 = idleinhibit focus, class:^(mpv)$
windowrulev2 = idleinhibit fullscreen, class:^(firefox)$
windowrulev2 = idleinhibit fullscreen, class:^(Brave-browser)$
windowrulev2 = idleinhibit fullscreen, class:^(chrome)$

# Opacity Rules
windowrulev2 = opacity 0.95 0.90, class:^(kitty)$
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$
windowrulev2 = opacity 0.95 0.90, class:^(Code)$

# Layer Rules for Blur & Shadow (Waybar, Rofi, Notifications)
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, dunst
layerrule = ignorezero, dunst

# ==============================================================================
# HYPRIDLE CONFIGURATION
# Auto dim, auto lock, and screen turn-off timer
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # Turn on display after resume
}

# Listener 1: Dim Screen brightness after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Listener 2: Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Listener 3: Turn off screen DPMS after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Listener 4: Suspend system after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

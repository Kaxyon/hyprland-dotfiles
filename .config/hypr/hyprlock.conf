# ==============================================================================
# HYPRLOCK CONFIGURATION
# Catppuccin Mocha Aesthetic Lock Screen
# ==============================================================================

background {
    monitor =
    path = ~/.config/hypr/wallpapers/default.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Clock - Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cba6f7ff) # Mauve
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# Clock - Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(cdd6f4ff) # Text
    font_size = 22
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 50
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = Hi, $USER 👋
    color = rgba(bac2deff) # Subtext1
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(cba6f7ff) rgba(89b4faff) 45deg
    inner_color = rgba(1e1e2ecc) # Base with transparency
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}
